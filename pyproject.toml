[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "domainwatch"
version = "0.1.0"
description = "What can an attacker see of your domain? Passive subdomain inventory and lookalike-domain watch"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Andile Mbele", email = "andilembele020@gmail.com" }]
keywords = ["attack-surface", "certificate-transparency", "typosquatting", "phishing", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = ["dnspython>=2.6"]

[project.urls]
Homepage = "https://github.com/xeroxzen/domainwatch"
Issues = "https://github.com/xeroxzen/domainwatch/issues"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/domainwatch"]

[tool.mypy]
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[project.scripts]
domainwatch = "domainwatch.cli:main"
